# CrowdSec dashboard configuration (architecture §8).
#
# Copy this file to /etc/crowdsec-dashboard/config.yaml, set the administrator
# password hash (see below), and restrict permissions (see
# deploy/install/README.md). The path is passed to the binary with --config:
#
#   /usr/local/bin/crowdsec-dashboard --config /etc/crowdsec-dashboard/config.yaml
#
# The file is read once at startup. Invalid values are a clear startup error;
# the server exits without listening. Only auth.admin_password_hash is secret;
# it is never logged and never served.

server:
  # Bind address. Default 127.0.0.1 (localhost only) — never 0.0.0.0.
  # Use a trusted internal interface only when intentionally exposing the
  # dashboard on the LAN. Termination of HTTPS is not provided by this
  # binary; when crossing an untrusted network you MUST put the dashboard
  # behind a TLS-terminating reverse proxy (see deploy/install/README.md).
  bind: "127.0.0.1"
  # Listen port. Default 8090; avoid 8080 (CrowdSec LAPI default).
  port: 8090

cscli:
  # Absolute path to the cscli executable (default /usr/bin/cscli).
  executable_path: "/usr/bin/cscli"
  # Per-command execution timeout (1s–120s).
  timeout: "30s"
  # Optional CrowdSec config directory. Used ONLY by the read-only
  # profiles.inspect boundary to read <dir>/profiles.yaml. It is never an
  # input to any command and never an arbitrary configuration-editing or
  # command-execution path. The service account needs read access here.
  crowdsec_config_dir: "/etc/crowdsec"

auth:
  # SECRET — REQUIRED, no default. The bcrypt (or argon2id) hash of the
  # administrator password. Never set this to a plaintext password.
  #
  # Generate it with the dashboard's documented setup procedure, e.g. using
  # htpasswd (bcrypt) or a small Go/argon2 helper. The placeholder below is
  # never accepted as a real secret: the server refuses to start until it is
  # replaced with a real hash.
  admin_password_hash: "<set-this-to-bcrypt-or-argon2id-hash>"

session:
  # Fixed session expiry (15m–24h; no sliding renewal in MVP).
  ttl: "8h"
  # HttpOnly session cookie name.
  cookie_name: "crowdsec_dashboard_session"

logging:
  # debug | info | warn | error
  level: "info"
  # text | json
  format: "text"
  # stderr (recommended for systemd/journald) or an absolute log path owned
  # by the service account.
  output: "stderr"